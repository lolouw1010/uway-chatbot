# Production cutover template. Do not enable until staging, provider, and rollback checks pass.
limit_req_zone $binary_remote_addr zone=uway_chat_api:10m rate=10r/m;

server {
    listen 443 ssl;
    server_name chatbot.hkuway.com;

    ssl_certificate /etc/letsencrypt/live/chatbot.hkuway.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatbot.hkuway.com/privkey.pem;

    location = /api/chat {
        limit_req zone=uway_chat_api burst=8 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}

server {
    listen 80;
    server_name chatbot.hkuway.com;
    return 301 https://$host$request_uri;
}
